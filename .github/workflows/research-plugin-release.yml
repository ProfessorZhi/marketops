name: research-plugin-release

# Push a tag `marketops-v<version>` (matching .claude-plugin/plugin.json) to publish the
# plugin folder as a zip on a GitHub Release. A tag with `-rc` is a pre-release.
on:
  push:
    tags:
      - "marketops-v*"
  # Or run it from the Actions tab on main: the tag is made from plugin.json.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the plugin version
        run: |
          declared=$(python -c "import json;print(json.load(open('plugins/research-tools/marketops-research-assistant/.claude-plugin/plugin.json'))['version'])")
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            test "${GITHUB_REF_NAME}" = "main" || { echo "run the release from main"; exit 1; }
            echo "RELEASE_TAG=marketops-v${declared}" >> "$GITHUB_ENV"
          else
            test "marketops-v${declared}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != plugin.json ${declared}"; exit 1; }
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi
      - name: Package the plugin folder
        run: |
          mkdir -p "${{ runner.temp }}/release"
          name="marketops-research-assistant-${RELEASE_TAG#marketops-}"
          cd plugins/research-tools
          zip -qr "${{ runner.temp }}/release/${name}.zip" marketops-research-assistant -x '*/__pycache__/*' '*/tests/*'
          cd "${{ runner.temp }}/release" && sha256sum "${name}.zip" > "${name}.zip.sha256" && cat "${name}.zip.sha256"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "${RELEASE_TAG}" in *-rc*) flags="--prerelease";; esac
          gh release create "${RELEASE_TAG}" $flags --target "${GITHUB_SHA}" \
            --title "MarketOps ${RELEASE_TAG#marketops-v}" \
            --notes "Install: unzip, run install.sh (Linux/macOS) or Install.ps1 (Windows), then add the plugin in Claude Code." \
            "${{ runner.temp }}"/release/marketops-research-assistant-v*.zip \
            "${{ runner.temp }}"/release/marketops-research-assistant-v*.zip.sha256
