# MarketOps research plugin: offline tests only (no network, no provider keys). Seconds, not minutes.
name: research-plugin-e2e

on:
  pull_request:
    paths:
      - "plugins/research-tools/**"
      - ".github/workflows/research-plugin-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: plugins/research-tools/marketops-research-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q "httpx>=0.27" "typesafe-sdk>=0.7,<1"   # the Jev paths are tested too
      - run: python -m compileall -q scripts tests
      - run: python -m unittest discover -s tests -v

  # The same plugin on every computer: a real MCP handshake over stdio (what every host does),
  # guide(), one agent claiming the pipeline, the cross-process lock and the installers, on
  # Linux, macOS and Windows.
  hosts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/research-tools/marketops-research-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q "mcp>=2.2,<3" "httpx>=0.27" "pypdf>=4,<7"
      - name: Installer self-check
        run: python scripts/server.py --check
      - name: Conformance
        run: python -m unittest tests.test_081_portability -v
      - name: Installer scripts parse
        if: runner.os != 'Windows'
        run: sh -n install.sh
      - name: Installer scripts parse (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/Install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
