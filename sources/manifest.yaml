# 与上面的三人群是同一个 chat 的第二份目录（messages.jsonl 逐字节相同）。canonical 取
# groups/party-group/，那份不作来源，也不进快照 —— 两份都收会让「一个 chat 两条来源」。
duplicate_navigation_not_used:
  - groups/party-group/oc_00000000000000000000000000000004/

