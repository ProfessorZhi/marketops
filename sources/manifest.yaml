# MarketOps 业务原始材料 —— 冻结快照的 provenance 清单
#
# 本文件回答的唯一问题：sources/ 里每一个字节是从哪里来的、选了多少、怎么选出来的。
# 公开树经过脱敏：以下逐字节约束描述采集阶段。snapshot_sha256 保留原始 pin，
# public_snapshot_sha256 校验当前公开字节；见 publication 与 REDACTION.md。
#
# 三条不变量（由 tests/test_business_sources.py 守着）：
#   1. 每条快照消息都是上游对应行的**逐字节**副本 —— 不做重写、不补字段、不删字段。
#   2. 三人群是**完整**复制：快照 sha256 必须等于上游 blob 的 sha256。
#   3. 私聊是**选择**复制：选中的 message_id 必须逐条列出，未列入的不在快照里。
#
# refresh 规则：本文件只允许**追加**新的 snapshot 记录，不允许原地改写已有条目的
# upstream_blob_sha / snapshot_sha256 / message_ids。历史 provenance 一旦写下就是事实，
# 覆盖它等于把「我们当时读的是哪一版」这件事删掉。
#
# 上游 commit 的解析是**逐条目**的：条目自己带 source_repository_commit 就用它自己那个，
# 没有才回退到顶层那个值（sources/README.md §8 第 2 条要求「新条目的
# source_repository_commit 记下当时 upstream-records 的 HEAD」）。顶层那个值是**第一条快照
# 的 pin 与回退值**，不是「所有条目共用一条上游」——后者会把后来追加的条目拿去和一条
# 更早的上游比，届时报文说「blob 已变」，而真实的处置是「这条 pin 没写」。
#
# 已测事实（2026-09-23）：顶层 b81eb776… **不被 records 的任何 ref 指向**（records 的
# main 在 2026-09-22 被重写过）。对象仍可读，所以按 pin 取字节的老条目照常校验；
# 但「这个 commit 在上游仓库里能被人 checkout 到」这件事对它不成立，这是本次追加
# 新条目时改用逐条目 pin 的第二个理由。此处不改写那个值 —— 它是历史事实。
#
# 已测事实（2026-09-23，第二条）：4 条 member-c 条目的 pin **已从
# e9ce8b749bd453dbf392d5cc45037c02e3234905 移到 e6c8c81c0ff512bb087ec9f346fb3b8d876d6fd5**。
# 旧值当时的处境与新值的关系，逐条记在这里，因为它是事实而不是笔误：
#
#   * e9ce8b7 是**当时** records 的 HEAD（本文件的天条：条目记自己那一版的上游），
#     本仓读它读到的字节没有错。它被改写**不是**因为本仓读错了。
#   * e9ce8b7 **从未被推出过任何远端**。records 2026-09-23 做发布面投影时把它改写为
#     e6c8c81c：同一个 parent（2e61200）、author 与 message 原样，只是树里去掉了那一个
#     blob（`744a0e86…`，向日葵远控面板截图）。改写未推出的提交不是 force-push，
#     也不覆盖任何人的工作；原对象仍留在 records 本机
#     `refs/preserve/member-c-deep-archive-e9ce8b7` 上。
#   * 所以旧 pin 的毛病与 b81eb776 是**同一类**：对象在本机可读，出了本机取不到。
#     区别是这次能修而不用牺牲准确性 —— 本仓引用的四个路径
#     （`messages.jsonl` 与三个附件 `8d585d65…` / `00e5d6cf…` / `5f6ae258…`）
#     在新旧两个提交的树里**逐字节相同**（实测），且新值在 records 的远端可达。
#     留旧值等于让一个指不到东西、且指向一个含被排除字节的版本的 pin 继续存在。
#   * 迁移后**旧值仍然记在这里**（上一段就是这个记录）。移 pin 不是「改写历史」，
#     是把「当时读的是哪一版」从机器字段（会 dangle）挪到散文（不会）——
#     §8 第 1 条禁改的是 upstream_blob_sha / snapshot_sha256 / message_ids，不含 pin。
#   * 执行器：tests/test_sources_snapshot.py 的
#     `test_entry_level_pins_are_reachable_from_the_upstream_remote`。

schema: marketops/business-source-snapshot.v1

publication:
  snapshot_kind: redacted-public-derivative
  redaction_policy: REDACTION.md
  snapshot_sha256: Historical pre-redaction snapshot pin; never rewritten.
  public_snapshot_sha256: SHA256 of the published derivative bytes in this repository.

source_repository: ProfessorZhi/upstream-records
source_repository_commit: b81eb7760e6c93b3a361c1e300a908095cbfeebc
snapshot_date: 2026-09-20
snapshot_branch: marketops/repository-convergence

# 长期原始档案权威是 source_repository。本仓库的 sources/ 是**项目自包含的冻结快照**：
# 它让 canonical repo 能脱离 upstream-records 检出独立理解与独立测试（见 docs/SOURCES.md）。
snapshot_root: sources/

# 唯一 approved business channels。不在这个列表里的来源不得进入 sources/。
#
# **这份列表是通道集合的定义点。** docs/SOURCES.md 与 tests/test_business_sources.py
# 都从它读，不各自另立一份 —— 两份定义会漂移，而漂移的那份是没人看的那份。
# 加一条通道 = 改这里（并给它一份快照），不是改测试里的元组。
#
#   chat_id      飞书会话 id，用于核对条目确实来自这条通道
#   channel_root records 里该通道的**目录**前缀。docs 引用的 source_ref 必须落在这里面；
#                 与 chat_id 是两级：channel_root 是通道目录，chat_id 是它下面的会话目录。
approved_channels:
  - id: member-a-private
    label: Member-A 私聊
    chat_id: oc_00000000000000000000000000000001
    channel_root: information/raw/feishu/chats/people/member-a/
  - id: member-d-private
    label: Member-D 私聊
    chat_id: oc_00000000000000000000000000000003
    channel_root: information/raw/feishu/chats/people/member-d/
  - id: member-c-private
    label: Member-C 私聊
    chat_id: oc_00000000000000000000000000000002
    channel_root: information/raw/feishu/chats/people/member-c/
  - id: party-group
    label: Member-A / Member-B / Member-D 三人群
    chat_id: oc_00000000000000000000000000000004
    channel_root: information/raw/feishu/chats/groups/party-group/

