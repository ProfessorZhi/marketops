<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570"
     role="img" aria-label="一个 MarketOps 插件融合六个上游项目，并留出一个由部署方提供的执行面：客户端只连接一个 MCP">
  <defs>
    <marker id="spoke" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <style>
      .sat { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .ext { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.4; stroke-dasharray: 6 4; }
      .name { font: 600 14px system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .role { font: 12px system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .core { fill: #0f172a; }
      .corename { font: 700 17px system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .corerole { font: 12.5px system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #cbd5e1; }
      .clients { font: 600 12.5px system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .sect { font: 700 12px system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; letter-spacing: .06em; }
    </style>
  </defs>

  <rect width="900" height="570" fill="#f1f5f9"/>

  <!-- 客户端 -->
  <g>
    <text class="clients" x="450" y="32" text-anchor="middle">Claude Code · Codex · WorkBuddy —— 只连一个 MCP</text>
    <line x1="450" y1="42" x2="450" y2="74" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#spoke)"/>
  </g>

  <!-- 上层三个 -->
  <g>
    <rect class="sat" x="119" y="80" width="190" height="66" rx="12"/>
    <text class="name" x="214" y="106" text-anchor="middle">Serper</text>
    <text class="role" x="214" y="127" text-anchor="middle">搜索 · 地图</text>

    <rect class="sat" x="355" y="80" width="190" height="66" rx="12"/>
    <text class="name" x="450" y="106" text-anchor="middle">SerpApi</text>
    <text class="role" x="450" y="127" text-anchor="middle">非 Google 引擎</text>

    <rect class="sat" x="591" y="80" width="190" height="66" rx="12"/>
    <text class="name" x="686" y="106" text-anchor="middle">TinyFish</text>
    <text class="role" x="686" y="127" text-anchor="middle">搜索 · 页面提取</text>
  </g>

  <!-- 核心 -->
  <g>
    <rect class="core" x="250" y="210" width="400" height="96" rx="16"/>
    <text class="corename" x="450" y="247" text-anchor="middle">MarketOps 插件</text>
    <text class="corerole" x="450" y="270" text-anchor="middle">主 Skill 给方法 · 一个 MCP 给事实</text>
    <text class="corerole" x="450" y="289" text-anchor="middle">宿主不必分别接六家厂商</text>
  </g>

  <!-- 连线 -->
  <g stroke="#94a3b8" stroke-width="1.6" marker-end="url(#spoke)">
    <line x1="214" y1="148" x2="330" y2="207"/>
    <line x1="450" y1="148" x2="450" y2="205"/>
    <line x1="686" y1="148" x2="570" y2="207"/>
    <line x1="330" y1="308" x2="260" y2="386"/>
    <line x1="450" y1="308" x2="450" y2="386"/>
    <line x1="570" y1="308" x2="640" y2="386"/>
  </g>

  <!-- 下层三个 -->
  <g>
    <rect class="sat" x="165" y="390" width="190" height="66" rx="12"/>
    <text class="name" x="260" y="416" text-anchor="middle">DeepSeek</text>
    <text class="role" x="260" y="437" text-anchor="middle">搜索 · 读页 · 失败不计费</text>

    <rect class="sat" x="355" y="390" width="190" height="66" rx="12"/>
    <text class="name" x="450" y="416" text-anchor="middle">Crawl4AI</text>
    <text class="role" x="450" y="437" text-anchor="middle">本地浏览器 · 免费</text>

    <rect class="sat" x="545" y="390" width="190" height="66" rx="12"/>
    <text class="name" x="640" y="416" text-anchor="middle">Jev / TypeSafe</text>
    <text class="role" x="640" y="437" text-anchor="middle">有界语义判断</text>
  </g>

  <!-- 执行面：由部署方提供，不随插件捆绑 -->
  <text class="sect" x="450" y="492" text-anchor="middle">可替换的执行面</text>
  <g>
    <rect class="ext" x="255" y="504" width="390" height="44" rx="10"/>
    <text class="name" x="450" y="522" text-anchor="middle">派发执行器 · 外部受限 worker</text>
    <text class="role" x="450" y="540" text-anchor="middle">由部署方通过环境变量接入，插件不捆绑</text>
  </g>
  <path d="M270,306 V470 H240" fill="none" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ext)"/>
</svg>
